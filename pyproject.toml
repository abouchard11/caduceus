[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "caduceus"
version = "0.3.1"
description = "Multi-seat decision engine on Hermes Agent: council deliberation, believability ledger, command guard. The operator is the Shaper; the seats are staff."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Alex Bouchard (MidnightDev)" }]
dependencies = []            # stdlib only, on purpose

[project.scripts]
cad = "caduceus.cli:main"

[tool.setuptools]
packages = ["caduceus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
